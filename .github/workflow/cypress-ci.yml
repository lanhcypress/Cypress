name: Cypress Automation Test CI

# Kích hoạt hành động: Cứ có ai push code lên nhánh "main" là chạy test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest # Chạy trên hệ điều hành Ubuntu của GitHub

    steps:
      # Bước 1: Tải code mới nhất từ GitHub Repository về server ảo
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      # Bước 2: Cypress chính chủ tự lo (Tự cài NodeJS, tự npm install, tự chạy test)
      - name: Chạy Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          # Truyền câu lệnh script bạn muốn chạy (đã khai báo trong package.json)
          command: npm run test:staging
